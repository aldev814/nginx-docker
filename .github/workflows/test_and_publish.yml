name: Test and Publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag matching Nginx, e.g. v1.31.8-upd1; empty always means test only'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: nginx-tests-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: nginx-ci:${{ github.sha }}
    outputs:
      release_tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      major_minor: ${{ steps.plan.outputs.major_minor }}
      image_id: ${{ steps.image.outputs.image_id }}
      artifact_name: ${{ steps.image.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Validate release intent and tag before building
        id: plan
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 .github/scripts/release.py plan

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=nginx-amd64
          cache-to: type=gha,mode=max,scope=nginx-amd64

      - name: Inspect and test the image
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE" nginx -V
          bash .github/scripts/test_image.sh "$IMAGE"

      - name: Collect container diagnostics
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/nginx-diagnostics"
          docker ps -a > "$RUNNER_TEMP/nginx-diagnostics/containers.txt"
          if docker container inspect test_nginx > /dev/null 2>&1; then
            docker logs test_nginx > "$RUNNER_TEMP/nginx-diagnostics/nginx.log" 2>&1
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nginx-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nginx-diagnostics/
          retention-days: 7

      - name: Remove test container
        if: always()
        run: docker rm -f test_nginx > /dev/null 2>&1 || true

      - name: Save the tested image for publishing
        if: steps.plan.outputs.tag != ''
        id: image
        run: |
          set -euo pipefail
          image_id=$(docker image inspect --format '{{.Id}}' "$IMAGE")
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=tested-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/tested-image.tar.gz"

      - name: Upload the tested image
        if: steps.plan.outputs.tag != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.image.outputs.artifact_name }}
          path: ${{ runner.temp }}/tested-image.tar.gz
          compression-level: 0
          retention-days: 3

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: nginx-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: nginx-ci:${{ github.sha }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      VERSION: ${{ needs.build.outputs.version }}
      MAJOR_MINOR: ${{ needs.build.outputs.major_minor }}
      EXPECTED_IMAGE_ID: ${{ needs.build.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject stale or existing releases
        run: python3 .github/scripts/release.py check-target

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/tested-image

      - name: Load and verify the tested image
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/tested-image/tested-image.tar.gz" | docker load
          [[ "$(docker image inspect --format '{{.Id}}' "$IMAGE")" == "$EXPECTED_IMAGE_ID" ]]
          [[ "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")" == "$GITHUB_SHA" ]]

      - name: Authenticate registries
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : "${DOCKER_HUB_USERNAME:?Configure DOCKER_USERNAME}"
          : "${DOCKER_HUB_TOKEN:?Configure DOCKER_TOKEN}"
          printf '%s' "$DOCKER_HUB_TOKEN" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Reserve the immutable Git tag before pushing images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py check-target
          gh auth setup-git
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Push the tested image, then update aliases
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          dockerhub="$DOCKER_HUB_USERNAME/${GITHUB_REPOSITORY##*/}"
          for registry_image in "$ghcr" "$dockerhub"; do
            docker tag "$EXPECTED_IMAGE_ID" "$registry_image:$VERSION"
            docker push "$registry_image:$VERSION"
          done
          # Recheck freshness before changing mutable aliases; the reserved tag must match this commit.
          remote_main=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$remote_main" == "$GITHUB_SHA" ]] || { echo 'main advanced; version pushed but aliases were not changed'; exit 1; }
          for registry_image in "$ghcr" "$dockerhub"; do
            for alias in "$MAJOR_MINOR" latest; do
              docker tag "$EXPECTED_IMAGE_ID" "$registry_image:$alias"
              docker push "$registry_image:$alias"
            done
          done

      - name: Logout registries
        if: always()
        run: |
          docker logout ghcr.io || true
          docker logout || true
