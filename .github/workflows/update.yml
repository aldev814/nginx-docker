name: Update Dependencies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      nginx_version:
        description: 'Nginx version or series (e.g. 1.31.8 or 1.31); empty keeps the current series'
        type: string
        required: false
      headers_more_version:
        description: 'Headers More stable version; empty selects the latest stable version'
        type: string
        required: false
      pcre2_version:
        description: 'PCRE2 stable version; empty selects the latest stable version'
        type: string
        required: false
      allow_downgrade:
        description: 'Allow an explicitly requested version downgrade'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dependency-updates
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require main branch
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Run dependency updates from main'; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check workflow regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Prepare active dependency updates
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          IN_NGINX: ${{ inputs.nginx_version }}
          IN_HEADERS_MORE: ${{ inputs.headers_more_version }}
          IN_PCRE2: ${{ inputs.pcre2_version }}
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: python3 .github/scripts/update_dependencies.py --output-dir "$RUNNER_TEMP/dependency-update"

      - name: Open a dependency-update PR
        if: steps.check.outputs.updated == 'true'
        env:
          # A PAT is needed so the branch/PR events trigger the read-only PR tests.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          BRANCH: ${{ steps.check.outputs.branch }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Configure GH_PAT with permission to push a branch and open a PR}"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json url --jq '.[0].url // ""')
          if [[ -n "$existing" ]]; then
            echo "This dependency set already has a PR: $existing"
            exit 0
          fi
          remote_branch=$(git ls-remote origin "refs/heads/$BRANCH")
          gh auth setup-git
          if [[ -n "$remote_branch" ]]; then
            # Recover if the previous run pushed the branch but PR creation failed.
            git fetch --no-tags origin "refs/heads/$BRANCH"
            git show FETCH_HEAD:Dockerfile > "$RUNNER_TEMP/dependency-update/remote-Dockerfile"
            cmp Dockerfile "$RUNNER_TEMP/dependency-update/remote-Dockerfile"
          else
            git switch -c "$BRANCH"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Dockerfile
            git commit -F "$RUNNER_TEMP/dependency-update/title.txt"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "$(cat "$RUNNER_TEMP/dependency-update/title.txt")" \
            --body-file "$RUNNER_TEMP/dependency-update/body.md"
